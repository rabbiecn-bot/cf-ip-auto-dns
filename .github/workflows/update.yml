name: Update DNSHE CF IP

on:
  schedule:
    - cron: "0 * * * *"

  workflow_dispatch:


jobs:

  update:

    runs-on: ubuntu-latest


    steps:

    - name: Checkout
      uses: actions/checkout@v4


    - name: Install Python
      uses: actions/setup-python@v5
      with:
        python-version: "3.x"


    - name: Install libs
      run: |
        pip install requests


    - name: Run updater
      env:
        DNSHE_KEY: ${{ secrets.DNSHE_KEY }}

      run:
        python main.py
